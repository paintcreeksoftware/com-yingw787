name: Check bundle size diff

on:
  pull_request:

concurrency:
  group: check-bundle-size-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-bundle-size-diff:
    name: Check bundle size diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # The action installs before each build; reuse the PR's install for
          # the base build when the lockfile is unchanged.
          install-script: >-
            bash -c "test -d node_modules && git diff --quiet ${{ github.sha }} -- package-lock.json || npm ci"
          build-script: build
          pattern: '.next/static/**/*.{js,css}'
