name: Check secrets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          extra_args: ${{ github.event_name != 'pull_request' && '--only-verified' || '' }}
