name: Check secrets

on:
  push:
  pull_request:

concurrency:
  group: check-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          extra_args: ${{ github.event_name != 'pull_request' && '--only-verified' || '' }}
