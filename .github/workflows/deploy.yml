name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-checks:
    name: Wait for required checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
    steps:
      - name: Wait for required checks on commit
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = [
              'Audit',
              'Check bundle size',
              'Check dead links',
              'Lint',
              'Secret scan',
              'Smoke test',
              'Typecheck',
            ]
            const sha = context.payload.pull_request?.head?.sha ?? context.sha
            const pollIntervalMs = 10_000
            const missingGraceMs = 120_000
            const startedAt = Date.now()

            console.log(`Waiting for required checks on ${sha}: ${requiredChecks.join(', ')}`)

            while (true) {
              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                },
              )

              const latestByName = new Map()
              for (const run of checkRuns) {
                const prev = latestByName.get(run.name)
                if (!prev || run.id > prev.id) {
                  latestByName.set(run.name, run)
                }
              }

              const failed = []
              const pending = []
              const missing = []

              for (const name of requiredChecks) {
                const run = latestByName.get(name)
                if (!run) {
                  missing.push(name)
                } else if (run.status !== 'completed') {
                  pending.push(`${name} (${run.status})`)
                } else if (run.conclusion !== 'success') {
                  failed.push(`${name}: ${run.conclusion} (${run.html_url})`)
                }
              }

              if (failed.length > 0) {
                core.setFailed(`Required checks failed on ${sha}:\n- ${failed.join('\n- ')}`)
                return
              }

              if (pending.length === 0 && missing.length === 0) {
                const summary = requiredChecks.map((name) => {
                  const run = latestByName.get(name)
                  return `- ${name}: ${run.conclusion} (completed ${run.completed_at})`
                })
                console.log(`All required checks passed on ${sha}:\n${summary.join('\n')}`)
                return
              }

              if (missing.length > 0 && Date.now() - startedAt > missingGraceMs) {
                core.setFailed(
                  `Required checks never appeared on ${sha} after ${missingGraceMs / 1000}s: ${missing.join(', ')}`,
                )
                return
              }

              const waiting = [...pending, ...missing.map((name) => `${name} (not started)`)]
              console.log(`Waiting: ${waiting.join(', ')}`)
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs))
            }

  deploy:
    name: Deploy
    needs: wait-for-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          firebaseToolsVersion: 15.37.0
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
      - name: Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.firebase.outputs.details_url || format('https://{0}.web.app', vars.FIREBASE_PROJECT_ID) }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Print Lighthouse scores
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const manifest = ${{ steps.lighthouse.outputs.manifest }}
            const summary = manifest[0].summary
            const scores = {
              Performance:    Math.round(summary.performance * 100),
              Accessibility:  Math.round(summary.accessibility * 100),
              'Best practices': Math.round(summary['best-practices'] * 100),
              SEO:            Math.round(summary.seo * 100),
            }
            const lines = Object.entries(scores).map(([k, v]) => `${k}: ${v}`)
            console.log('Lighthouse scores\n' + lines.join('\n'))
